[project]
name = "hep-units"
version = "0.1.0"
description = "The CLHEP HEP system of units as a C++ header, Python module and Jsonnet library, from a single source of truth"
readme = "README.md"
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The generated module and the generator itself use only the standard library.
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
